; TaskLogger 設定ファイル（TaskLogger.exe と同じフォルダに置く）
; 変更後は TaskLogger を再起動すると反映されます。

; ログの保存先（相対パスは exe のフォルダ基準）
LogDir=logs

; ブラウザのURLを記録するか (true/false)
CaptureUrl=true

; URLの記録範囲: full=そのまま / noquery=?以降を除く / domain=ドメインのみ
UrlDetail=noquery

; クリックしたボタン名・タブ名・セル番地などを記録するか
CaptureElement=true

; ブラウザ内のクリック対象(リンク名など)も記録するか
; 重いページでブラウザが遅く感じたら false にしてください
CaptureElementInBrowser=true

; 右クリックも記録するか
RecordRightClick=true

; 同じ場所への連続クリック(ダブルクリック等)をまとめる秒数
DedupSeconds=2

; サマリーの時間計算で「操作なし」とみなす上限(分)
IdleCapMinutes=10

; 記録しないアプリ（プロセス名をカンマ区切り。.exe は省略可）
ExcludeProcesses=KeePass, KeePassXC, 1Password, Bitwarden, LockApp

; ウィンドウタイトルにこの語が含まれる時は記録しない（シークレットウィンドウ等）
PrivateKeywords=InPrivate, シークレット, Incognito, プライベート ブラウジング, Private Browsing

; --- 会議の検出（サマリーのみで使用。記録処理には影響しません） ---
; 会議画面の操作がこの分数以上ないと、その会議は終わったとみなす
MeetingGapMinutes=20
; 退出操作なしで途切れた同じ会議が、この分数以内に再開したら1つにまとめる
MeetingMergeMinutes=60
